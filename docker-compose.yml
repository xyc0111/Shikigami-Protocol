services:
  shikigami:
    build: .
    image: shikigami-protocol
    container_name: shikigami
    restart: unless-stopped
    ports:
      - "7788:7788"
    volumes:
      # Persistent user data — survive container rebuilds
      - ./profiles:/app/profiles
      - ./models:/app/models
      - ./Voices:/app/Voices
      # Config is mounted read-write so settings UI can save changes
      - ./config:/app/config
      # DH_live 数字人资产（wasm/形象视频/桥接 js，~17MB）脱离镜像热更新：
      # git pull 后立即生效，无需 rebuild。注意：整目录覆盖镜像层同名路径，
      # 删除宿主机该目录会导致容器内资源为空；换形象/改渲染器走 git 即可。
      - ./static:/app/static
      # .env for API keys (copy from .env.example first)
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUTF8=1
      - PYTHONUNBUFFERED=1
    # Uncomment to pass GPU into container (requires nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
